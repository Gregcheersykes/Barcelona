<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Barcelona Allergies App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 10px;
            min-height: calc(100vh - 20px);
            background: #1e293b;
            border: 10px solid white;
            border-radius: 15px;
            font-family: 'Inter', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 40px 32px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
        }

        .login-icon {
            font-size: 44px;
            margin-bottom: 8px;
        }

        h1 {
            margin: 0 0 6px;
            font-size: 1.5rem;
            font-weight: 700;
            color: white;
        }

        .subtitle {
            margin: 0 0 28px;
            color: #cbd5e1;
            font-size: 0.95rem;
        }

        #google-login-btn {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 12px 20px;
            background: white;
            color: #1f2937;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        #google-login-btn:hover {
            background: #f1f5f9;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(56, 189, 248, 0.35);
        }

        #google-login-btn:active { transform: translateY(0); }

        .note {
            margin: 20px 0 0;
            font-size: 0.8rem;
            color: #94a3b8;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #38bdf8;
            font-size: 0.9rem;
            text-decoration: none;
        }

        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>

       <div class="login-card">
        <div class="login-icon">🍷</div>
        <h1>Administrator Login</h1>
        <p class="subtitle">Barcelona Allergies App</p>

        <button id="google-login-btn">
            <span style="color: #4285F4; font-weight: 700; font-size: 1.2rem;">G</span>
            Sign in with Google
        </button>

        <p class="note">Chef & Management Access Only</p>
        <a class="back-link" href="index.html">&larr; Back to Main App</a>
    </div>
